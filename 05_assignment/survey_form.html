<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Customer Feedback Survey</title>
    </head>
    <body>
        <h1>Customer Feedback Survey</h1>
        <p>Thank you for taking the time to share your feedback with us.</p>

        <form action="#" method="POST">

            <h2>User Information</h2>
            <p>
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full_name" required>
            </p>
            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <h2>Your Experience</h2>
            <fieldset>
                <legend>How satisfied are you with our service?</legend>

                <input type="radio" id="very-satisfied" name="satisfaction" value="very-satisfied">
                <label for="very-satisfied">Very satisfied</label>
                <br>

                <input type="radio" id="satisfied" name="satisfaction" value="satisfied">
                <label for="satisfied">Satisfied</label>
                <br>

                <input type="radio" id="neutral" name="satisfaction" value="neutral">
                <label for="neutral">Neutral</label>
                <br>

                <input type="radio" id="dissatisfied" name="satisfaction" value="dissatisfied">
                <label for="dissatisfied">Dissatisfied</label>
                <br>

                <input type="radio" id="very-dissatisfied" name="satisfaction" value="very-dissatisfied">
                <label for="very-dissatisfied">Very dissatisfied</label>
            </fieldset>

            <h2>Features</h2>
            <fieldset>
                <legend>What features do you value most? (Select all that apply)</legend>

                <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                <label for="ease-of-use">Ease of use</label>
                <br>

                <input type="checkbox" id="customer-support" name="features" value="customer-support">
                <label for="customer-support">Customer support</label>
                <br>

                <input type="checkbox" id="pricing" name="features" value="pricing">
                <label for="pricing">Pricing</label>
                <br>

                <input type="checkbox" id="speed" name="features" value="speed">
                <label for="speed">Speed and performance</label>
            </fieldset>

            <h2>About You</h2>
            <p>
                <label for="role">What best describes you?</label>
                <select id="role" name="role">
                    <option value="student">Student</option>
                    <option value="professional">Professional</option>
                    <option value="hobbyist">Hobbyist</option>
                    <option value="other">Other</option>
                </select>
            </p>

            <h2>Additional Comments</h2>
            <p>
                <label for="comments">Additional comments or suggestions? (Optional)</label>
                <br>
                <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
            </p>

            <button type="submit">Submit Survey</button>

        </form>
    </body>
</html>
